# Evite la mise en pause du projet Supabase gratuit (7 jours sans activite).
# (Deplace ici depuis le depot prive : minutes Actions gratuites et illimitees.)
# Secrets a creer dans GitHub > Settings > Secrets and variables > Actions :
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours, 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel leger (fonction ping)
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
